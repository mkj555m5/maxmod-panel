# Railway configuration for maxmod-panel
# Docs: https://docs.railway.app/deploy/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["src/**", "prisma/**", "public/**", "package.json", "next.config.ts", "tsconfig.json", "Dockerfile"]

[deploy]
# When using DOCKERFILE builder, startCommand is optional — Dockerfile CMD is used.
# But Railway may still try to override it. We set it explicitly to use our script.
# The script runs prisma db push then starts node server.js (NO bun needed at runtime)
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/api/health"
healthcheckTimeout = 100

# ==========================================
# Volume (persistent storage for SQLite DB)
# ==========================================
# Without a volume, the SQLite database is wiped on every redeploy.
# This volume persists /data across deployments and restarts.
[[deploy.volume]]
name = "maxmod-data"
mountPath = "/data"
size = "1GB"

# ==========================================
# Required environment variables (set in Railway dashboard):
# ==========================================
# DATABASE_URL = file:/data/custom.db   <- MUST point to /data so DB persists
# PORT = 8080                           <- auto-set by Railway
# HOSTNAME = 0.0.0.0                    <- required for Railway
# NODE_ENV = production
